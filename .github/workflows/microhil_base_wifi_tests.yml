name: microhil_base_wifi tests
on:
  push:
    branches: [ master ]
    paths:
      - 'sw/microhil_base_wifi/src/**/*.c'
      - 'sw/microhil_base_wifi/src/**/*.h'
      - 'sw/microhil_base_wifi/**/CMakeLists.txt'
      - 'sw/microhil_base_wifi/**/*.cmake'
      - 'sw/microhil_base_wifi_tests/**/*.cc'
      - 'sw/microhil_base_wifi_tests/**/*.h'
      - 'sw/microhil_base_wifi_tests/**/CMakeLists.txt'
      - 'sw/microhil_base_wifi_tests/**/*.cmake'
      - '.github/workflows/microhil_base_wifi_tests.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'sw/microhil_base_wifi/src/**/*.c'
      - 'sw/microhil_base_wifi/src/**/*.h'
      - 'sw/microhil_base_wifi/**/CMakeLists.txt'
      - 'sw/microhil_base_wifi/**/*.cmake'
      - 'sw/microhil_base_wifi_tests/**/*.cc'
      - 'sw/microhil_base_wifi_tests/**/*.h'
      - 'sw/microhil_base_wifi_tests/**/CMakeLists.txt'
      - 'sw/microhil_base_wifi_tests/**/*.cmake'
      - '.github/workflows/microhil_base_wifi_tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Configure CMake
        run: |
          cd sw/microhil_base_wifi_tests
          mkdir -p build && cd build
          cmake ..
      - name: Build tests
        run: |
          cd sw/microhil_base_wifi_tests/build
          make -j$(nproc)
      - name: Run unit tests
        run: |
          cd sw/microhil_base_wifi_tests/build
          ctest --output-on-failure
