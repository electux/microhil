name: microhil_upy tests
on:
  push:
    branches: [ master ]
    paths:
      - 'sw/microhil_upy/apps/microhil/**/*.py'
      - 'sw/microhil_upy_tests/**/*.py'
      - '.github/workflows/microhil_upy_tests.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'sw/microhil_upy/apps/microhil/**/*.py'
      - 'sw/microhil_upy_tests/**/*.py'
      - '.github/workflows/microhil_upy_tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run unit tests
        run: |
          cd sw/microhil_upy_tests
          python3 run_tests.py
